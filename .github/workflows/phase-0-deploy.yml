name: Phase 0 Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  id-token: write

env:
  APP_SLUG: aoc-app-template-nextjs
  ACR_NAME: acraocappsprod
  ACR_LOGIN_SERVER: acraocappsprod.azurecr.io
  LOG_ANALYTICS_RG: loganalytics
  LOG_ANALYTICS_NAME: AOCLogAnalytics

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    env:
      AZURE_LOCATION: ${{ secrets.AZURE_LOCATION || vars.AZURE_LOCATION || 'australiaeast' }}
      DEPLOY_ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST || vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID || vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_OAUTH_SECRET_1: ${{ secrets.DATABRICKS_OAUTH_SECRET_1 }}
      DATABRICKS_OAUTH_SECRET_2: ${{ secrets.DATABRICKS_OAUTH_SECRET_2 }}
      LAKEBASE_ENDPOINT_PATH: ${{ secrets.LAKEBASE_ENDPOINT_PATH || vars.LAKEBASE_ENDPOINT_PATH }}
      LAKEBASE_PGHOST: ${{ secrets.LAKEBASE_PGHOST || vars.LAKEBASE_PGHOST }}
      LAKEBASE_PGPORT: ${{ secrets.LAKEBASE_PGPORT || vars.LAKEBASE_PGPORT || '5432' }}
      LAKEBASE_DATABASE: ${{ secrets.LAKEBASE_DATABASE || vars.LAKEBASE_DATABASE }}
      LAKEBASE_USER: ${{ secrets.LAKEBASE_USER || vars.LAKEBASE_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run check

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${ACR_LOGIN_SERVER}/${APP_SLUG}:${GITHUB_SHA}"
          az acr login --name "${ACR_NAME}"
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Provision and deploy Container App
        shell: bash
        run: |
          set -euo pipefail

          RESOURCE_GROUP="rg-app-${APP_SLUG}-${DEPLOY_ENV}"
          CONTAINER_ENV="cae-${APP_SLUG}-${DEPLOY_ENV}"
          CONTAINER_APP="ca-${APP_SLUG}-${DEPLOY_ENV}"
          IDENTITY_NAME="id-app-${APP_SLUG}-${DEPLOY_ENV}"

          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait

          az group create \
            --name "${RESOURCE_GROUP}" \
            --location "${AZURE_LOCATION}" \
            --tags \
              ApplicationName="${APP_SLUG}" \
              Environment="${DEPLOY_ENV}" \
              ManagedBy="GitHub-Actions" \
              Repository="${GITHUB_REPOSITORY}"

          WORKSPACE_ID="$(az monitor log-analytics workspace show \
            --resource-group "${LOG_ANALYTICS_RG}" \
            --workspace-name "${LOG_ANALYTICS_NAME}" \
            --query customerId \
            --output tsv)"

          WORKSPACE_KEY="$(az monitor log-analytics workspace get-shared-keys \
            --resource-group "${LOG_ANALYTICS_RG}" \
            --workspace-name "${LOG_ANALYTICS_NAME}" \
            --query primarySharedKey \
            --output tsv)"

          if ! az containerapp env show --name "${CONTAINER_ENV}" --resource-group "${RESOURCE_GROUP}" >/dev/null 2>&1; then
            az containerapp env create \
              --name "${CONTAINER_ENV}" \
              --resource-group "${RESOURCE_GROUP}" \
              --location "${AZURE_LOCATION}" \
              --logs-workspace-id "${WORKSPACE_ID}" \
              --logs-workspace-key "${WORKSPACE_KEY}"
          fi

          az identity create \
            --name "${IDENTITY_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --location "${AZURE_LOCATION}"

          IDENTITY_ID="$(az identity show \
            --name "${IDENTITY_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query id \
            --output tsv)"

          IDENTITY_PRINCIPAL_ID="$(az identity show \
            --name "${IDENTITY_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query principalId \
            --output tsv)"

          ACR_ID="$(az acr show \
            --name "${ACR_NAME}" \
            --query id \
            --output tsv)"

          az role assignment create \
            --assignee-object-id "${IDENTITY_PRINCIPAL_ID}" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "${ACR_ID}" || true

          COMMON_ENV_VARS=(
            "APP_NAME=${APP_SLUG}"
            "APP_ENVIRONMENT=${DEPLOY_ENV}"
            "DATABRICKS_HOST=${DATABRICKS_HOST}"
            "DATABRICKS_CLIENT_ID=${DATABRICKS_CLIENT_ID}"
            "DATABRICKS_OAUTH_SECRET_1=secretref:databricks-oauth-secret-1"
            "DATABRICKS_OAUTH_SECRET_2=secretref:databricks-oauth-secret-2"
            "LAKEBASE_ENDPOINT_PATH=${LAKEBASE_ENDPOINT_PATH}"
            "LAKEBASE_PGHOST=${LAKEBASE_PGHOST}"
            "LAKEBASE_PGPORT=${LAKEBASE_PGPORT}"
            "LAKEBASE_DATABASE=${LAKEBASE_DATABASE}"
            "LAKEBASE_USER=${LAKEBASE_USER}"
          )

          if ! az containerapp show --name "${CONTAINER_APP}" --resource-group "${RESOURCE_GROUP}" >/dev/null 2>&1; then
            az containerapp create \
              --name "${CONTAINER_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --environment "${CONTAINER_ENV}" \
              --image "${IMAGE}" \
              --target-port 3000 \
              --ingress external \
              --min-replicas 0 \
              --max-replicas 1 \
              --cpu 0.5 \
              --memory 1Gi \
              --user-assigned "${IDENTITY_ID}" \
              --registry-server "${ACR_LOGIN_SERVER}" \
              --registry-identity "${IDENTITY_ID}" \
              --secrets \
                "databricks-oauth-secret-1=${DATABRICKS_OAUTH_SECRET_1}" \
                "databricks-oauth-secret-2=${DATABRICKS_OAUTH_SECRET_2}" \
              --env-vars "${COMMON_ENV_VARS[@]}"
          else
            az containerapp secret set \
              --name "${CONTAINER_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --secrets \
                "databricks-oauth-secret-1=${DATABRICKS_OAUTH_SECRET_1}" \
                "databricks-oauth-secret-2=${DATABRICKS_OAUTH_SECRET_2}"

            az containerapp update \
              --name "${CONTAINER_APP}" \
              --resource-group "${RESOURCE_GROUP}" \
              --image "${IMAGE}" \
              --set-env-vars "${COMMON_ENV_VARS[@]}"
          fi

          FQDN="$(az containerapp show \
            --name "${CONTAINER_APP}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          echo "APP_URL=https://${FQDN}" >> "$GITHUB_ENV"

      - name: Verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "${APP_URL}/api/health"

      - name: Verify audit endpoint when Lakebase variables are present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LAKEBASE_ENDPOINT_PATH}" || -z "${LAKEBASE_PGHOST}" || -z "${LAKEBASE_DATABASE}" ]]; then
            echo "Skipping /api/audit-test because Lakebase connection variables are not fully configured."
            exit 0
          fi
          curl --fail --show-error --silent "${APP_URL}/api/audit-test"
